name: Bug report
description: Report a reproducible desktop, offline, sync, or packaging defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include steps and whether the app was online, offline, or synchronizing.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inventory UI
        - Offline data or sync
        - Authentication or API
        - Electron window or IPC
        - Localization or theme
        - Packaging or update
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: STOCKMACHINE version, operating system, install type, and sanitized logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and tenant-sensitive values.
          required: true
