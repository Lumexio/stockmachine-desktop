name: Feature request
description: Propose a desktop inventory or offline workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain online and offline behavior, navigation, and expected sync behavior.
    validations:
      required: true
  - type: textarea
    id: parity
    attributes:
      label: Cross-client and localization impact
      description: Note backend, web, mobile, pricing, and en/es/fr/ja/ru changes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
